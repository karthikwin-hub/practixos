# Production archive target: OCI Object Storage in ap-mumbai-1.
# Fill the key settings from the instance credential store. Do not commit them.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=practixos-pgbackrest
repo1-s3-endpoint=compat.objectstorage.ap-mumbai-1.oraclecloud.com
repo1-s3-region=ap-mumbai-1
repo1-s3-key-type=shared
repo1-s3-key=REPLACE_FROM_INSTANCE_CREDENTIAL
repo1-s3-key-secret=REPLACE_FROM_INSTANCE_CREDENTIAL
repo1-retention-full=2
start-fast=y

[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-database=practixos_test
