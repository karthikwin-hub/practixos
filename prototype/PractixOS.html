  if(k === "q"){ const i = $("pq"); if(i){ i.focus(); i.setSelectionRange(v.length, v.length); } }
}
ACT.spec = (k) => { S.booking.spec = k; render(); };
ACT["pick-doc"] = (id) => { S.booking.docId = id; S.booking.step = 1; render(); };
ACT["pick-slot"] = (ms) => { S.booking.slot = new Date(Number(ms)); render(); };
ACT["pick-patient"] = (_, el) => { S.booking.pid = el.value || null; S.booking.verified = false; render(); };
ACT.verify = () => {
  if((S.booking.code||"").length < 4) return toast("Enter the six-digit code", null, "warn");
  S.booking.verified = true;
  audit("identity.verify","WhatsApp OTP verified", S.booking.pid ? patName(S.booking.pid) : "new patient");
  render(); toast("Number verified","Identity confirmed over WhatsApp");
};
ACT.step = (n) => { S.booking.step = Number(n); if(Number(n)===0) S.booking.slot=null; render(); };
ACT.confirm = () => {
  const s = T(), b = S.booking, d = doc(b.docId), f = feeFor(b.pid, b.docId);
  if(!b.pid){
    const pid = "n"+Date.now().toString(36);
    s.patients.push(P(pid,"New patient","—","—",S.lang,"+91 00000-00000",null,[],null));
    b.pid = pid;
  }
  const token = Math.max(0, ...s.appointments.map(a=>a.token)) + 1;
  b.token = token;
  s.appointments.push(A("bk"+token, b.pid, d.id, d.visiting?null:s.chairs[0].id,
    b.slot.getHours(), b.slot.getMinutes(), d.minutes||30, "Booked online", "expected", f.fee, d.prepay?f.fee:0, token));
  if(d.prepay && f.fee) s.cash.upi += f.fee;
  audit("appointment.create","Booked "+patName(b.pid)+" with "+d.name, hhmm(b.slot)+" · "+(f.free?"free follow-up":inr(f.fee))+" · token T"+token);
  S.waPid = b.pid; S.scenarioStep = 0;
  b.step = 4; render();
  toast("Booked as T"+token, f.free ? "Free follow-up applied automatically" : inr(f.fee)+" "+(d.prepay?"prepaid":"due at the clinic"));
};
ACT["play-voice"] = (_, el) => {
  const w = el.querySelector(".wa-wave");
  if(w){ w.classList.add("play"); setTimeout(()=>w.classList.remove("play"), 2400); }
  audit("voice.play","Voice note played", langName(S.lang));
  toast("Playing in "+langName(S.lang), "Synthesised with Bhashini — free for Indian languages");
};
ACT["see-wa"] = () => go("whatsapp");

/* -- whatsapp -------------------------------------------------------------- */
ACT["wa-next"] = () => {
  S.scenarioStep = Math.min(5, S.scenarioStep + 1);
  render();
  const c = $("canvas").querySelector(".wa-body"); if(c) c.scrollTop = c.scrollHeight;
};
ACT["wa-pick"] = (pid) => { S.waPid = pid; S.scenarioStep = 0; render(); };

/* -- isolation probe ------------------------------------------------------- */
ACT.probe = (target) => {
  const cfg = TENANT(), s = T();
  const t0 = Date.now();
  if(target === "self"){
    const p = s.patients[0];
    S.isoResult = esc(
`SET LOCAL app.clinic_id = '`+cfg.id+`';
SELECT id, full_name, phone, alerts
  FROM patients
 WHERE id = '`+p.id+`';`)
    + '\n\n<span class="ok">(1 row)</span>  '
    + esc(p.id+"  |  "+p.name+"  |  "+phone(p.phone)+"  |  "+(p.alerts.join(", ")||"—"))
    + '\n\n-- policy satisfied: clinic_id matches the session\n-- '+(Date.now()-t0)+' ms';
    audit("iso.probe","Read within the workspace — 1 row", cfg.id);
  } else {
    const other = tenantById(target);
    S.isoResult = esc(
`SET LOCAL app.clinic_id = '`+cfg.id+`';
SELECT id, full_name, phone
  FROM patients
 WHERE clinic_id = '`+target+`';`)
    + '\n\n<span class="deny">(0 rows)</span>\n\n'
    + esc('-- Not "permission denied". The policy filtered every row of ')+esc(other.name)
    + esc(' out\n-- before this query could observe them, so nothing can be inferred\n-- about whether those records exist at all.')
    + '\n-- '+(Date.now()-t0)+' ms';
    audit("iso.probe","Cross-workspace read refused — 0 rows", "attempted: "+target);
  }
  render();
  const box = $("canvas").querySelector(".iso-result"); if(box) box.scrollIntoView({block:"center"});
};

/* ==========================================================================
   9. WIRING AND BOOT
   ========================================================================== */
document.addEventListener("click", e => {
  if(Date.now() - dragEndedAt < 300) return;   // suppress the click a drag leaves behind
  const nav = e.target.closest("[data-go]");
  if(nav) return go(nav.dataset.go);
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const fn = ACT[b.dataset.act];
  if(fn) fn(b.dataset.arg, b);
});
document.addEventListener("change", e => {
  const b = e.target.closest("[data-act]");
  if(b && (b.tagName === "SELECT")){
    if(b.dataset.act === "dsm"){ T().vault.meta.dsm = b.value; audit("note.dsm","Formulation set to "+b.value, patName(T().vault.pid)); }
    else { const fn = ACT[b.dataset.act]; if(fn) fn(b.dataset.arg, b); }
  }
});
$("scrim").addEventListener("click", e => { if(e.target.id === "scrim") closeModal(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
  if(e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && S.session.tenantId){
    e.preventDefault(); ACT.more();
  }
});

let resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if(applyLay()) render(); }, 130);
});
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if(S.session.tenantId && allModules().includes(h) && h !== S.view){ S.view = h; render(); }
});

/* Top-level `const` in a classic script is script-scoped, not a window property,
   so automation gets one deliberate handle rather than a hundred globals. */
window.PractixOS = {S, T, TENANT, TENANTS, VIEWS, ACT, MODULES, MODULES_BY_VERTICAL, UTILITY_MODULES,
                    render, go, signIn, signOut, closeModal, modules, allModules, feeFor, slotFree, audit};

(function init(){
  try{ const m = localStorage.getItem("practix.lay"); if(m) S.layMode = m; }catch(err){}
  applyLay();
  resolveTenant();
  /* ?clinic=<slug>&as=<module> deep-links straight into a role. Real sign-in
     replaces this; it exists so a link can open the board on the reception
     tablet, and so the layout checker can reach every screen without clicking. */
  const as = new URLSearchParams(location.search).get("as");
  if(S.gatePick && as && MODULES_BY_VERTICAL[tenantById(S.gatePick).vertical].concat(UTILITY_MODULES).includes(as)){
    signIn(as);
    const h = location.hash.slice(1);
    if(h && allModules().includes(h) && h !== as){ S.view = h; }
  }
  render();
})();
</script>
