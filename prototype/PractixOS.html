const stages   = () => (T() ? T().stages : STAGES_DENTAL);
const laneOf   = id => stages().find(l=>l.id===id) || stages()[0];
const roleOf   = id => laneOf(id).role;
const byRole   = r  => stages().filter(l=>l.role===r);
const roleStage= r  => byRole(r)[0] || stages()[0];
const laneTab  = () => (stages().some(l=>l.id===S.laneTab) ? S.laneTab : stages()[0].id);
function nextLane(id){
  const all = stages(), i = all.findIndex(l=>l.id===id);
  return (i < 0 || i === all.length-1) ? "done" : all[i+1].id;
}
function waited(a){ return a.arrived ? Math.max(0, Math.floor((S.clock - a.arrived)/60000)) : null; }
/* A dwell alert is a per-stage number, which is how an eye clinic gets to flag
   a patient who has been dilating too long without anyone writing code for it. */
function overdue(a){
  const st = laneOf(a.lane);
  if(!st.dwell) return 0;
  const m = waited(a) || 0;
  return m > st.dwell*2 ? 2 : m > st.dwell ? 1 : 0;
}
function heatOf(a){
  const st = laneOf(a.lane);
  if(!st.dwell) return st.heat;
  return ["#3F6B46","#C97A12","#B33F33"][overdue(a)];
}
function inLane(id){ return T().appointments.filter(a => a.lane === id); }
function inRole(){
  const want = [].concat.apply([], Array.from(arguments));
  const ids = stages().filter(l=>want.includes(l.role)).map(l=>l.id);
  return T().appointments.filter(a => ids.includes(a.lane));
}
/* FR-2.2: the token is the patient's place in *this practitioner's* queue.
   A clinic-wide number is meaningless when one doctor is running late. */
function tokenOf(a){
  const mine = T().appointments
    .filter(x => x.doc === a.doc && x.lane !== "cancelled")
    .sort((x,y) => x.start - y.start);
  const i = mine.findIndex(x => x.id === a.id);
  return i < 0 ? a.token : i + 1;
}
const measures = () => (T() && T().measures) || MEASURES_GENERAL;
const listOut = xs => xs.length < 2 ? (xs[0]||"") : xs.slice(0,-1).join(", ")+" and "+xs[xs.length-1];
const initials = n => String(n||"").replace(/^(Dr\.?|Sr\.?)\s+/i,"")
  .split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

/* -- one queue card, identical on every screen size ------------------------ */
function qcard(a){
  const p = pat(a.pid), d = doc(a.doc), w = waited(a);
  const alerts = p && p.alerts.length ? p.alerts : [];
  return '<article class="qcard" data-card="'+a.id+'" style="--heat:'+heatOf(a)+'">'
  + '<div class="qc-top"><div style="min-width:0">'
    + '<div class="qc-name">'+esc(p?p.name:"Walk-in")+'</div>'
    + '<div class="row tight" style="margin-top:4px">'
      + '<span class="token" title="Position in '+esc(d?d.name:"the")+'&#39;s queue">'
        + (d?esc(initials(d.name))+'·':'')+'T'+tokenOf(a)+'</span>'
      + (a.mode==="video"?'<span class="chip mini">Video</span>':'')
      + (p && guardianOf(p.id)
          ? '<span class="chip mini" title="Consent by proxy">With '+esc(guardianOf(p.id).relation.toLowerCase())+'</span>' : '')
      + (alerts.length?'<span class="stamp s-risk" style="font-size:.55rem;padding:2px 5px">'+esc(alerts[0])+'</span>':'')
    + '</div></div>'
    + '<button class="grip" data-drag="'+a.id+'" aria-label="Move '+esc(p?p.name:"card")+'">⠿</button>'
  + '</div>'
  + '<div class="qc-meta">'
    + '<span>'+hhmm(a.start)+' · '+esc(a.reason)+'</span>'
    + '<span class="muted">'+esc(d?d.name:"—")+' · '+esc(room(a.chair))+'</span>'
    + (w!=null && laneOf(a.lane).dwell
        ? '<span style="color:'+heatOf(a)+';font-weight:700">'+esc(laneOf(a.lane).label)+' '+w+' min'
          + (overdue(a)?' — over '+laneOf(a.lane).dwell:'')+'</span>' : '')
    + (a.feeNote ? '<span style="color:var(--sage);font-weight:700">'+esc(a.feeNote)+'</span>' : '')
    + (a.pkg ? '<span style="color:var(--accent-2);font-weight:700">'+esc(a.pkg)+'</span>' : '')
  + '</div>'
  + '<div class="qc-act">' + laneActions(a) + '</div>'
  + '</article>';
}
/* The primary button is the stage's own `adv` label. A settlement stage ends in
   money instead, and a fully prepaid appointment has nothing left to collect. */
function laneActions(a){
  const st = laneOf(a.lane);
  const more = '<button class="btn btn-g btn-s" data-act="card-menu" data-arg="'+a.id+'" style="flex:0 0 44px">⋯</button>';
  if(st.role === "settlement"){
    const due = a.fee - (a.paid||0);
    return due > 0
      ? '<button class="btn btn-w btn-s" data-act="collect" data-arg="'+a.id+'">Collect '+inr(due)+'</button>'+more
      : '<button class="btn btn-p btn-s" data-act="paid" data-arg="'+a.id+'|upi">Close — nothing due</button>'+more;
  }
  return '<button class="btn btn-p btn-s" data-act="advance" data-arg="'+a.id+'">'+esc(st.adv||"Advance")+'</button>'+more;
}

/* -- RECEPTION BOARD ------------------------------------------------------- */
VIEWS.reception = function(){
  const s = T(), cfg = TENANT();
  const risky = inRole("waiting","in_service").filter(a => pat(a.pid) && pat(a.pid).alerts.length);
  const collected = s.cash.cash + s.cash.upi;
  const waiting = inRole("waiting");
  const waits = waiting.map(waited).filter(x=>x!=null);
  const avg = waits.length ? Math.round(waits.reduce((x,y)=>x+y,0)/waits.length) : 0;
  const late = waiting.filter(a => overdue(a));

  const head = sectionHead("Today at the front desk", s.appointments.length+" appointments · "+hhmm(S.clock),
    '<button class="btn btn-g" data-act="dense">'+(S.dense?"Cards":"Compact")+'</button>'
    + '<button class="btn btn-p" data-act="walkin">+ Walk-in</button>');

  const band = risky.length
    ? '<div class="alert-band mb"><span class="bang">!</span><span>'
      + risky.map(a=>esc(pat(a.pid).name)+" — "+esc(pat(a.pid).alerts.join(", "))).join(" · ")
      + '</span></div>' : '';

  /* A dwell alert only earns its place if it is visible without hunting. */
  const dwellBand = late.length
    ? '<div class="alert-band warn mb"><span class="bang">⏱</span><span>'
      + late.map(a => esc(patName(a.pid))+" — "+esc(laneOf(a.lane).label.toLowerCase())
          +" "+waited(a)+" min, over the "+laneOf(a.lane).dwell+"-minute mark").join(" · ")
      + '</span></div>' : '';

  const stats = '<div class="statgrid mb">'
    + stat("Waiting now", waiting.length)
    + stat("Average wait", avg+" min")
    + stat("Collected", inr(collected))
    + stat("Pending", inr(s.cash.pending))
    + '</div>';

  const board = S.dense ? denseBoard() : laneBoard();

  return head + band + dwellBand + stats + board
  + '<div class="callout mt"><b>BR-01 runs before money is named.</b> The fee shown on each card already accounts for the '
    + cfg.followupDays+'-day free follow-up window configured for '+esc(cfg.name)
    + '. Staff never calculate it, so staff can never get it wrong.</div>'
  + '<div class="callout mt"><b>These lanes are configuration, not code.</b> '+esc(cfg.name)+' runs '
    + stages().length+' stages — '+stages().map(l=>esc(l.label)).join(", ")
    + '. Adding a stage is a row, which is how the eye clinic in this directory gets a '
    + '<i>Dilating</i> lane with a 20-minute dwell alert without a single line of ophthalmology-specific code.</div>'
  + activityCard();
};

/* The default: one lane per stage, or one at a time with a segmented control
   on a phone, where there is nowhere to drag to anyway. */
function laneBoard(){
  if(S.lay === "phone"){
    const seg = '<div class="seg mb">' + stages().map(l =>
      '<button class="'+(laneTab()===l.id?"on":"")+'" data-act="lane" data-arg="'+l.id+'">'
      + esc(l.short)+'<span class="n">'+inLane(l.id).length+'</span></button>').join("") + '</div>';
    const l = laneOf(laneTab());
    const cards = inLane(l.id);
    return seg + '<div class="lane" data-lane="'+l.id+'">'
      + (cards.length ? cards.map(qcard).join("")
         : '<p class="muted" style="padding:22px 4px;text-align:center">No one in '+esc(l.label.toLowerCase())+'.</p>')
      + '</div>';
  }
  return '<div class="board" style="--lanes:'+stages().length+'">'
    + stages().map(l => {
      const cards = inLane(l.id);
      return '<section class="lane" data-lane="'+l.id+'">'
        + '<div class="lane-h"><span class="lane-t">'+esc(l.label)+'</span><span class="lane-n">'+cards.length+'</span></div>'
        + (cards.length ? cards.map(qcard).join("") : '<p class="faint" style="font-size:.76rem;padding:8px 2px">Empty</p>')
        + '</section>';
    }).join("") + '</div>';
}

/* FR-2.1, high-velocity mode. A paediatric evening runs sixty to eighty
   patients; a card grid stops being legible long before that, so the same data
   collapses to one scannable row each. */
function denseBoard(){
  const rows = T().appointments
    .filter(a => a.lane !== "cancelled" && a.lane !== "done")
    .sort((a,b) => stages().findIndex(l=>l.id===a.lane) - stages().findIndex(l=>l.id===b.lane) || a.start - b.start)
    .map(a => {
      const p = pat(a.pid), d = doc(a.doc), st = laneOf(a.lane), w = waited(a);
      return {
        who:'<b>'+esc(p?p.name:"Walk-in")+'</b>'
            + (p && p.alerts.length ? ' <span class="stamp s-risk" style="font-size:.52rem;padding:1px 4px">!</span>' : ''),
        tok:'<span class="token">'+(d?esc(initials(d.name))+'·':'')+'T'+tokenOf(a)+'</span>',
        stage:'<span class="stamp flat" style="background:'+st.heat+'22;color:'+st.heat+'">'+esc(st.label)+'</span>',
        wait:(w!=null && st.dwell) ? '<span style="color:'+heatOf(a)+';font-weight:700">'+w+'m</span>' : '—',
        why:'<span class="muted">'+esc(a.reason)+'</span>',
        act:'<button class="btn btn-g btn-s" data-act="card-menu" data-arg="'+a.id+'">⋯</button>'
      };
    });
  return '<div class="card mb"><div class="card-h"><div><h3>Compact list</h3>'
    + '<p class="muted" style="font-size:.76rem">Every open patient on one screen, ordered by stage</p></div>'
    + '<span class="stamp s-mute flat">'+rows.length+' open</span></div><div class="card-b">'
    + dataTable([{k:"who",h:"Patient"},{k:"tok",h:"Token"},{k:"stage",h:"Stage"},
                 {k:"wait",h:"Waited",r:true},{k:"why",h:"Reason"},{k:"act",h:"",r:true}],
                rows, {title:"who"})
    + '</div></div>';
}
function stat(label, value){
  return '<div class="stat"><div class="eyebrow">'+esc(label)+'</div><div class="sv">'+esc(String(value))+'</div></div>';
}
function activityCard(){
  const s = T();
  return '<div class="card mt"><div class="card-h"><div><h3>Activity</h3>'
    + '<p class="muted" style="font-size:.76rem">Append-only. Every row is signed with role and workspace.</p></div>'
    + '<span class="stamp s-mute flat">'+s.audit.length+' entries</span></div>'
    + '<div class="card-b"><div class="feed">'
    + (s.feed.length ? s.feed.slice(0,12).map(f =>
        '<div class="feed-row"><span class="feed-t">'+hhmm(f.ts)+'</span>'
        + '<span class="feed-r">'+esc(f.role)+'</span>'
        + '<span style="min-width:0"><b>'+esc(f.what)+'</b>'
        + (f.detail?'<br><span class="muted">'+esc(f.detail)+'</span>':'')+'</span></div>').join("")
      : '<p class="muted">Nothing recorded yet in this session.</p>')
    + '</div></div></div>';
}

/* -- NURSE SLATE ----------------------------------------------------------- */
VIEWS.nurse = function(){
  const s = T();
  const queue = inRole("waiting","in_service");
  if(!S.nursePatient && queue.length) S.nursePatient = queue[0].pid;
  const p = pat(S.nursePatient);

  const picker = '<div class="seg mb">' + (queue.length ? queue.map(a =>
      '<button class="'+(S.nursePatient===a.pid?"on":"")+'" data-act="nurse-pick" data-arg="'+a.pid+'">'
      + esc(patName(a.pid).split(" ")[0])+'<span class="n">T'+tokenOf(a)+'</span></button>').join("")
    : '<button class="on">Nobody waiting</button>') + '</div>';

  if(!p) return sectionHead("Triage slate","Nobody is waiting for vitals right now.") + picker;

  const v = p.vitals || {};
  /* What gets measured at triage is a tenant setting. An eye clinic records
     visual acuity and intraocular pressure and has no use at all for a
     random blood sugar; the tile grid is the same code either way. */
  const tiles = measures().map(x => '<button class="vital-tile'+(v[x.k]!=null?" set":"")+'" data-act="vital" data-arg="'+x.k+'" data-label="'+esc(x.l)+'" data-unit="'+esc(x.u)+'" data-mode="'+(x.mode||"num")+'">'
    + '<span class="vl">'+esc(x.l)+'</span>'
    + '<span class="vv'+(v[x.k]==null?" empty":"")+'">'+(v[x.k]!=null?esc(String(v[x.k])):"Tap to record")+'</span>'
    + '<span class="vu">'+esc(x.u)+'</span></button>').join("");

  const chips = ALERT_TAGS.map(tag =>
    '<button class="alert-opt'+(p.alerts.includes(tag)?" on":"")+'" data-act="alert" data-arg="'+esc(tag)+'">'
    + '<span class="tick">'+(p.alerts.includes(tag)?"✓":"")+'</span>'+esc(tag)+'</button>').join("");

  const need = measures().filter(x => x.req);
  const missing = need.filter(x => v[x.k] == null);
  const ready = missing.length === 0;

  return sectionHead("Triage slate", p.name+" · "+p.age+"/"+p.sex+" · "+phone(p.phone))
  + picker
  + (p.alerts.length ? '<div class="alert-band mb"><span class="bang">!</span><span>'+esc(p.alerts.join(" · "))+'</span></div>' : '')
  + '<div class="slate mb">'
    + '<div class="eyebrow mb">Vitals — tap a tile, use the keypad</div>'
    + '<div class="vital-grid">'+tiles+'</div>'
    + '<p class="hint" style="margin-top:11px">Targets are 60 px because this is used standing up, often with gloves on. '
      + 'Nothing here needs a keyboard.</p>'
  + '</div>'
  + '<div class="card mb"><div class="card-h"><h3>Clinical alerts</h3>'
    + '<span class="muted" style="font-size:.76rem">Shown to every clinician who opens this record</span></div>'
    + '<div class="card-b"><div class="alert-pick">'+chips+'</div></div></div>'
  + '<button class="btn btn-p btn-xl btn-full" data-act="to-doctor"'+(ready?"":" disabled")+'>'
    + (ready ? "Send "+esc(p.name.split(" ")[0])+" in to the doctor"
             : "Record "+esc(listOut(missing.map(x=>x.l.toLowerCase())))+" first")+'</button>';
};

/* -- RECALL ENGINE --------------------------------------------------------- */
/* This screen is the front end of the leakage argument. A dormant treatment
   plan is not a clinical problem, it is money the practice already earned the
   right to and never collected, and nobody at the front desk has time to go
   looking for it. Everything recovered here lands in the FR-7.4 ledger with
   the recall id attached, so the owner can audit the claim. */
const ruleOf = id => (T().recallRules || []).find(r => r.id === id) || {label:"Recall", value:0};
const overdueDays = r => Math.round((S.clock - r.due) / 86400000);
function recallWindow(r){
  const a = ruleOf(r.rule).after || {};
  return a.months ? a.months + (a.months===1?" month":" months") : a.days + " days";
}

VIEWS.recalls = function(){
  const s = T(), cfg = TENANT();
  const all = s.recalls || [];
  const due     = all.filter(r => r.status === "due"     && overdueDays(r) >= 0);
  const upcoming= all.filter(r => r.status === "due"     && overdueDays(r) <  0);
  const sent    = all.filter(r => r.status === "sent");
  const booked  = all.filter(r => r.status === "booked");
  const atStake = due.reduce((n,r) => n + r.value, 0);

  const head = sectionHead("Recall engine",
    due.length+" overdue · "+inr(atStake)+" of work already indicated",
    due.length ? '<button class="btn btn-p" data-act="recall-all">Send all '+due.length+'</button>' : "");

  const stats = '<div class="statgrid mb">'
    + stat("Overdue now", due.length)
    + stat("At stake", inr(atStake))
    + stat("Awaiting reply", sent.length)
    + stat("Rebooked", booked.length)
    + '</div>';

  const row = (r, act) => {
    const d = overdueDays(r), rule = ruleOf(r.rule);
    return {
      who:'<b>'+esc(patName(r.pid))+'</b><br><span class="muted" style="font-size:.74rem">'+esc(rule.label)+'</span>',
      when: d >= 0
        ? '<span style="color:'+(d>14?"var(--vermilion)":"var(--marigold)")+';font-weight:700">'+d+' days over</span>'
        : '<span class="muted">in '+Math.abs(d)+' days</span>',
      basis:'<span class="muted" style="font-size:.74rem">'+esc(rule.trigger.replace(/_/g," "))
            +' · every '+esc(recallWindow(r))+'</span>',
      worth:'<b>'+inr(r.value)+'</b>',
      act:act(r)
    };
  };

  const dueCard = '<div class="card mb"><div class="card-h"><div><h3>Overdue</h3>'
    + '<p class="muted" style="font-size:.76rem">Ranked by what the visit is worth, not by how old it is</p></div></div>'
    + '<div class="card-b">'
    + dataTable([{k:"who",h:"Patient"},{k:"when",h:"Due"},{k:"basis",h:"Rule"},
                 {k:"worth",h:"Worth",r:true},{k:"act",h:"",r:true}],
        due.slice().sort((a,b)=>b.value-a.value).map(r => row(r, x =>
          '<button class="btn btn-p btn-s" data-act="recall-send" data-arg="'+x.id+'">Send</button>')),
        {title:"who", empty:"Nothing is overdue. That is the point."})
    + '</div></div>';

  const waitCard = (sent.length || booked.length)
    ? '<div class="card mb"><div class="card-h"><div><h3>Sent</h3>'
      + '<p class="muted" style="font-size:.76rem">A recall only becomes recovered revenue once it produces a booking</p></div></div>'
      + '<div class="card-b">'
      + dataTable([{k:"who",h:"Patient"},{k:"when",h:"Due"},{k:"basis",h:"Rule"},
                   {k:"worth",h:"Worth",r:true},{k:"act",h:"",r:true}],
          sent.concat(booked).map(r => row(r, x => x.status === "booked"
            ? '<span class="stamp s-ok flat" style="font-size:.55rem">Rebooked · ledger</span>'
            : '<button class="btn btn-g btn-s" data-act="recall-book" data-arg="'+x.id+'">Mark rebooked</button>')),
          {title:"who"})
      + '</div></div>'
    : "";

  const soonCard = upcoming.length
    ? '<div class="card mb"><div class="card-h"><div><h3>Coming up</h3>'
      + '<p class="muted" style="font-size:.76rem">Nothing to do yet — shown so the desk is never surprised</p></div></div>'
      + '<div class="card-b">'
      + dataTable([{k:"who",h:"Patient"},{k:"when",h:"Due"},{k:"basis",h:"Rule"},{k:"worth",h:"Worth",r:true}],
          upcoming.map(r => row(r, ()=>"")).map(x => (delete x.act, x)), {title:"who"})
      + '</div></div>'
    : "";

  const rulesCard = '<div class="card mb"><div class="card-h"><div><h3>Rules for '+esc(cfg.name)+'</h3>'
    + '<p class="muted" style="font-size:.76rem">'+(s.recallRules||[]).length+' rules, all of them rows in a table</p></div>'
    + '<span class="stamp s-mute flat">'+esc(cfg.verticalLabel)+'</span></div>'
    + '<div class="card-b">'
    + dataTable([{k:"name",h:"Rule"},{k:"trig",h:"Fires on"},{k:"win",h:"After"},{k:"why",h:"Because"}],
        (s.recallRules||[]).map(r => ({
          name:'<b>'+esc(r.label)+'</b>',
          trig:'<code class="ic-code">'+esc(r.trigger)+'</code>',
          win: esc(r.after.months ? r.after.months+" months" : r.after.days+" days"),
          why:'<span class="muted">'+esc(r.why)+'</span>'
        })), {title:"name"})
    + '</div></div>';

  return head + stats + dueCard + waitCard + soonCard + rulesCard
  + '<div class="callout mt"><b>Four triggers, every vertical.</b> '
    + '<code class="ic-code">last_visit</code>, <code class="ic-code">plan_dormant</code>, '
    + '<code class="ic-code">procedure_completed</code> and <code class="ic-code">age_months</code> '
    + 'are the whole engine. A dental scaling reminder and a diabetic retinopathy screening are the same '
    + 'row with different numbers in it, which is why the eye clinic in this directory needed no new code.</div>'
  + activityCard();
};

/* Recovered revenue is written once, at the moment a recall produces a booking
   — never when the message is merely sent. FR-7.4's anti-double-counting rule
   made concrete. */
function creditRecovery(kind, amount, evidence){
  const s = T();
  const line = s.recovered.find(r => r.k === kind);
  if(line){ line.n += 1; line.unit = Math.round((line.unit*(line.n-1) + amount)/line.n); }
  else s.recovered.push({k:kind, n:1, unit:amount});
  audit("recovery.credit", RECOVERY[kind].label+" +1 · "+inr(amount), evidence);
}

/* ==========================================================================
   FR-4.6 — PRINTABLE ARTIFACTS
   ========================================================================== */

/* Indian receipts carry the amount in words, and getting it wrong in front of
   a patient is the kind of small humiliation that loses a clinic. */
const ONES = ["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve",
  "thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function under100(n){ return n < 20 ? ONES[n] : TENS[Math.floor(n/10)] + (n%10 ? "-"+ONES[n%10] : ""); }
function under1000(n){
  return (n >= 100 ? ONES[Math.floor(n/100)]+" hundred" + (n%100 ? " and " : "") : "") + under100(n%100);
}
function inWords(n){
  n = Math.round(Math.abs(Number(n)||0));
  if(!n) return "Zero rupees only";
  /* Indian grouping: crore, lakh, thousand, then the last three digits. */
  const parts = [];
  const units = [[10000000,"crore"],[100000,"lakh"],[1000,"thousand"]];
  units.forEach(([div,word]) => {
    const q = Math.floor(n/div);
    if(q){ parts.push(under1000(q)+" "+word); n -= q*div; }
  });
  if(n) parts.push(under1000(n));
  const s = parts.join(" ");
  return s.charAt(0).toUpperCase()+s.slice(1)+" rupees only";
}

const ddmmyyyy = d => d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});

function sheetHead(cfg, d){
  return '<div class="sh-head">'
    + '<div class="sh-mark">'+esc(cfg.mark)+'</div>'
    + '<div style="min-width:0"><div class="sh-name">'+esc(cfg.name)+'</div>'
      + '<div class="sh-sub">'+esc(cfg.legal)+' · '+esc(cfg.city)+'</div>'
      + '<div class="sh-sub">'+esc(cfg.host)+'</div></div>'
    + (d ? '<div class="sh-doc"><b>'+esc(d.name)+'</b><br>'+esc(d.qual||"")
           + (d.qual?'<br>':'')+'Reg. '+esc(regNo(cfg,d))+'</div>' : '')
    + '</div>';
}
/* A prescription without a registration number is not a prescription. The
   number is derived here only because this is a prototype; in production it
   is a required field on the practitioner record. */
const regNo = (cfg,d) => (cfg.mark+"-"+String(d.id).toUpperCase()).slice(0,9)+"/"+cfg.since;

function sheetFoot(cfg, extra){
  return '<div class="sh-foot">'+(extra?esc(extra)+"<br>":"")

/* -- the prescription ------------------------------------------------------ */
function rxSheet(pid, size){
  const s = T(), cfg = TENANT(), p = pat(pid);
  const a = s.appointments.find(x => x.pid === pid) || s.appointments[0];
  const d = (a && doc(a.doc)) || s.practitioners[0];
  const plan = (s.plans[pid] || []);
  const v = p.vitals || {};
  const vitalLine = measures().filter(m => v[m.k] != null)
    .map(m => m.l+" "+v[m.k]+(m.u && m.u !== "6/x" ? " "+m.u : "")).join(" · ");

  /* Rx lines come from the treatment plan where one exists, because retyping
     what the chart already knows is how a wrong tooth number reaches a lab. */
  const lines = plan.length
    ? plan.map(x => ({item:x.name + (x.tooth ? " — tooth "+x.tooth : ""),
                      dose:"Sitting "+x.step, dur:x.mins+" min", note:x.status==="chair"?"Today":"Planned"}))
    : [{item:"Amoxicillin 500 mg", dose:"1 capsule, three times daily", dur:"5 days", note:"After food"},
       {item:"Ibuprofen 400 mg",   dose:"1 tablet as needed",          dur:"3 days", note:"Maximum 3 a day"},
       {item:"Chlorhexidine rinse",dose:"10 ml, twice daily",          dur:"7 days", note:"Do not swallow"}];

  return '<div class="sheet" data-size="'+size+'" style="--accent:'+cfg.accent.a+'">'
    + sheetHead(cfg, d)
    + '<div class="sh-body">'
    + '<div class="sh-meta">'
      + '<div><span>Patient</span> <b>'+esc(p.name)+'</b></div>'
      + '<div><span>Age / Sex</span> <b>'+esc(String(p.age))+' / '+esc(p.sex)+'</b></div>'
      + '<div><span>Date</span> <b>'+esc(ddmmyyyy(S.clock))+'</b></div>'
      + (p.abha ? '<div><span>ABHA</span> <b>'+esc(p.abha)+'</b></div>' : '')
    + '</div>'
    + (p.alerts.length
        ? '<div style="border:1.5px solid #B33F33;color:#7E2A20;border-radius:5px;padding:6px 9px;font-size:.82em;font-weight:700">'
          + 'Allergies and alerts: '+esc(p.alerts.join(", "))+'</div>' : '')
    + (vitalLine ? '<div class="sh-note"><b>Recorded today.</b> '+esc(vitalLine)+'</div>' : '')
    + '<div class="sh-rx">&#8478;</div>'
    + '<table class="sh-tbl"><thead><tr><th>Medication or procedure</th><th>How</th><th>How long</th><th>Note</th></tr></thead><tbody>'
    + lines.map(l => '<tr><td><b>'+esc(l.item)+'</b></td><td>'+esc(l.dose)+'</td>'
        + '<td>'+esc(l.dur)+'</td><td>'+esc(l.note)+'</td></tr>').join("")
    + '</tbody></table>'
    + '<div class="sh-note"><b>Advice.</b> '+esc(t("waCare").replace(/\{\w+\}/g,"").trim())+'</div>'
    + '<div class="sh-note"><b>Review.</b> A revisit within '+cfg.followupDays
      + ' days for the same complaint carries no consultation fee.</div>'
    + '<div class="sh-sign"><span class="line">'+esc(d.name)+'</span></div>'
    + '</div>'
    + sheetFoot(cfg, "Prescription · "+esc(p.name)+" · "+ddmmyyyy(S.clock))
    + '</div>';
}

/* -- the receipt ----------------------------------------------------------- */
function receiptSheet(apptId, size){
  const s = T(), cfg = TENANT();
  const a = s.appointments.find(x => x.id === apptId) || s.appointments[0];
  const p = pat(a.pid), d = doc(a.doc) || s.practitioners[0];
  const paid = a.paid || 0, due = Math.max(0, a.fee - paid);
  const lines = [{n:a.reason, q:1, rate:a.fee}];
  const no = "INV/"+cfg.since+"/"+String(a.id).toUpperCase().replace(/[^A-Z0-9]/g,"")+"/"+S.clock.getFullYear();

  return '<div class="sheet" data-size="'+size+'" style="--accent:'+cfg.accent.a+'">'
    + sheetHead(cfg, d)
    + '<div class="sh-body">'
    + '<div class="sh-meta">'
      + '<div><span>Receipt no.</span> <b>'+esc(no)+'</b></div>'
      + '<div><span>Date</span> <b>'+esc(ddmmyyyy(S.clock))+' '+esc(hhmm(S.clock))+'</b></div>'
      + '<div><span>Patient</span> <b>'+esc(p.name)+'</b></div>'
    + '</div>'
    + '<table class="sh-tbl"><thead><tr><th>Description</th><th class="r">Qty</th>'
      + '<th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>'
    + lines.map(l => '<tr><td>'+esc(l.n)+'</td><td class="r">'+l.q+'</td>'
        + '<td class="r">'+inr(l.rate)+'</td><td class="r">'+inr(l.q*l.rate)+'</td></tr>').join("")
    + (a.feeNote ? '<tr><td colspan="3">'+esc(a.feeNote)+' — BR-01</td><td class="r">'+inr(0)+'</td></tr>' : '')
    + '</tbody></table>'
    + '<div class="sh-total"><span>'+(due?"Paid":"Total")+'</span><span>'+inr(paid||a.fee)+'</span></div>'
    + '<div class="sh-words">'+esc(inWords(paid||a.fee))+'</div>'
    + (due ? '<div class="sh-total" style="border-top:none;font-size:.95em;color:#7E2A20">'
             + '<span>Still outstanding</span><span>'+inr(due)+'</span></div>' : '')
    + '<div class="sh-note"><b>Paid to</b> '+esc(cfg.vpa)+' · UPI, cash or card accepted.</div>'
    + '<div class="sh-note">Healthcare services by a registered practitioner are exempt from GST '
      + 'under Notification 12/2017 &mdash; Central Tax (Rate).</div>'
    + '<div class="sh-sign"><span class="line">For '+esc(cfg.legal)+'</span></div>'
    + '</div>'
    + sheetFoot(cfg, "Receipt "+no)
    + '</div>';
}

function toothSVG(state){
  const st = TOOTH_STATES[state || "healthy"];
  const body = '<path d="M12 2C8.4 2 7.3 3.6 4.6 3.6 2.6 3.6 1.6 5 1.6 7.4c0 3.2 1.3 4.7 1.9 7.5.5 2.3.4 5.6 1.9 5.6s1.5-3.8 3.8-3.8 2.3 3.8 3.8 3.8 1.4-3.3 1.9-5.6c.6-2.8 1.9-4.3 1.9-7.5 0-2.4-1-3.8-3-3.8C11.1 3.6 10 2 12 2z" '
    + 'transform="translate(2.6,0)" fill="'+st.fill+'" stroke="'+st.colour+'" stroke-width="1.5" stroke-linejoin="round"'
    + (state==="missing"?' stroke-dasharray="2.5 2"':'')+'/>';
  let mark = "";
  if(st.pattern === "hatch") mark = '<path d="M8 8l8 8M8 13l5 5" stroke="'+st.colour+'" stroke-width="1.4"/>';
  if(st.pattern === "cross") mark = '<path d="M9 8l6 8M15 8l-6 8" stroke="'+st.colour+'" stroke-width="1.6"/>';
  if(st.pattern === "dots")  mark = '<circle cx="12" cy="9" r="1.3" fill="'+st.colour+'"/><circle cx="9.5" cy="13" r="1.3" fill="'+st.colour+'"/><circle cx="14.5" cy="13" r="1.3" fill="'+st.colour+'"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+body+mark+'</svg>';
}
function toothBtn(n, chart){
  const st = chart[n] || "healthy", meta = TOOTH_STATES[st];
  return '<button class="tooth'+(S.selectedTooth===n?" sel":"")+'" data-act="tooth" data-arg="'+n+'" '
    + 'aria-label="Tooth '+n+', '+meta.label+'"><span class="tn">'+n+'</span>'
    + toothSVG(st)+'<span class="ts" style="color:'+meta.colour+'">'+esc(meta.short)+'</span></button>';
}

VIEWS.dental = function(){
  const s = T();

  const chairQ = s.appointments.filter(a => dentalDocs.includes(a.doc) && a.lane !== "done");
  if(!S.dentalPatient) S.dentalPatient = (chairQ[0] && chairQ[0].pid) || s.patients[0].id;
  const p = pat(S.dentalPatient);
  const chart = s.teeth[p.id] || {};
  const plan = s.plans[p.id] || [];

  const picker = '<div class="seg mb">' + s.patients.map(x =>
    '<button class="'+(S.dentalPatient===x.id?"on":"")+'" data-act="dental-pick" data-arg="'+x.id+'">'
    + esc(x.name.split(" ")[0])+'</button>').join("") + '</div>';

  /* Odontogram. A 32-tooth arch cannot be tapped accurately on a phone, so the

  } else {
    odo = '<div class="arch-label">Upper arch</div><div class="arch">'+FDI_UPPER.map(n=>toothBtn(n,chart)).join("")+'</div>'
        + '<div class="arch-label">Lower arch</div><div class="arch">'+FDI_LOWER.map(n=>toothBtn(n,chart)).join("")+'</div>';
  }

  const palette = '<div class="pal">' + Object.keys(TOOTH_STATES).map(k =>
    '<button class="'+(S.activeDiagnosis===k?"on":"")+'" data-act="diagnosis" data-arg="'+k+'">'
    + '<i style="background:'+TOOTH_STATES[k].colour+'"></i>'+esc(TOOTH_STATES[k].label)+'</button>').join("") + '</div>';

  const legend = '<div class="legend">' + Object.keys(TOOTH_STATES).map(k =>

  const planRows = plan.map((x,i) => ({
    step:'<b>'+x.step+'</b>',
    what:esc(x.name)+'<br><span class="muted" style="font-size:.72rem">Tooth '+x.tooth+(x.lab?' · lab work':'')+'</span>',
    mins:x.mins+" min",
    fee:'<b>'+inr(x.fee)+'</b>',
    status:'<span class="stamp '+(x.status==="done"?"s-ok":x.status==="chair"?"s-warn":"s-mute")+'">'
      + (x.status==="done"?"Done":x.status==="chair"?"In chair":"Planned")+'</span>',
    act:x.status==="chair" ? '<button class="btn btn-p btn-s" data-act="complete-step" data-arg="'+i+'">Complete</button>' : ""
  }));

  const consum = plan.filter(x=>x.status==="chair").flatMap(x=>x.consumables||[]);
  const stock = s.inventory;

  return '<div class="console">'

     : '<div class="callout mb">No clinical alerts recorded for this patient.</div>')

                planRows, {title:"what", empty:"No plan yet. Select a tooth and generate one from the protocol library."})

      + (consum.length ? consum.map(c => {

            + '<span>'+esc(c)+'</span><span class="muted">not tracked</span></div>';

            + '<span class="'+(tone?"":"muted")+'" style="'+(tone?"color:"+tone+";font-weight:700":"")+'">'
            + (b ? live+" usable"+(low?" · reorder":"") : "no usable stock")+'</span></div>';
        }).join("") : '<p class="muted">Nothing consumed yet.</p>')
      + '<button class="btn btn-g btn-full mt" data-act="deduct">Deduct from inventory</button></div></div>'
    + '<div class="card"><div class="card-h"><h3>Lab orders</h3></div><div class="card-b">'
      + (s.labOrders.length ? s.labOrders.map(o =>
          '<div style="padding:7px 0;border-bottom:1px solid #22352F"><div class="between">'
          + '<b>'+esc(o.id)+'</b><span class="stamp s-warn">'+esc(o.status)+'</span></div>'
          + '<div class="muted" style="font-size:.76rem;margin-top:3px">'+esc(o.type)+' · shade '+esc(o.shade)+'<br>'
          + esc(patName(o.pid))+' · tooth '+o.tooth+' · due '+esc(o.due)+'</div></div>').join("")
        : '<p class="muted">No open lab orders.</p>')
      + '<button class="btn btn-g btn-full mt" data-act="lab-order">Raise a lab order</button></div></div>'
  + '</div>'
  + '</div>';
};
/* ==========================================================================
   PRACTICE — stock, packages and families
   The three remaining tables of the configurable vertical engine, in the one
   place a practice manager thinks about them. Spec 4.6.3, 4.6.4, 4.6.5.
   ========================================================================== */
const DAY = 86400000;
const daysTo = d => Math.round((d - S.clock) / DAY);
const liveQty = it => it.batches.filter(b => daysTo(b.exp) >= 0).reduce((n,b)=>n+b.qty, 0);
const deadQty = it => it.batches.filter(b => daysTo(b.exp) <  0).reduce((n,b)=>n+b.qty, 0);
/* First-expiry-first-out. Ordering by receipt date is how a clinic ends up
   holding the short-dated lot at the back of the drawer. */
const fefo = it => it.batches.filter(b => daysTo(b.exp) >= 0 && b.qty > 0)
                             .sort((a,b) => a.exp - b.exp)[0] || null;
const pkgDef = id => (T().packages || []).find(p => p.id === id) || {label:"Package", sessions:0, price:0};
const relFor = pid => (T().relationships || []).filter(r =>
  (r.dependant === pid || r.guardian === pid) && (!r.validUntil || daysTo(r.validUntil) >= 0));
const guardianOf = pid => relFor(pid).find(r => r.dependant === pid) || null;

VIEWS.practice = function(){
  const s = T(), cfg = TENANT();

  /* -- stock ------------------------------------------------------------- */
  const expired = s.inventory.filter(it => deadQty(it) > 0);
  const soon = s.inventory.filter(it => it.batches.some(b => { const d = daysTo(b.exp); return d >= 0 && d <= 30; }));
  const low = s.inventory.filter(it => liveQty(it) <= it.buffer);

  const stockRows = s.inventory.map(it => {
    const live = liveQty(it), dead = deadQty(it), next = fefo(it);
    const d = next ? daysTo(next.exp) : null;
    return {
      item:'<b>'+esc(it.item)+'</b>'
           + (dead ? '<br><span class="stamp s-risk flat" style="font-size:.52rem">'+dead+' expired</span>' : ''),
      usable:'<b '+(live<=it.buffer?'style="color:var(--vermilion)"':'')+'>'+live+'</b>'
             + '<span class="muted" style="font-size:.72rem"> / buffer '+it.buffer+'</span>',
      lots: it.batches.map(b => {
          const dd = daysTo(b.exp);
          const tone = dd < 0 ? "var(--vermilion)" : dd <= 30 ? "var(--marigold)" : "var(--ink-3)";
          return '<span class="lot" style="--c:'+tone+'">'+esc(b.lot)+' · '+b.qty
               + ' · '+(dd < 0 ? Math.abs(dd)+"d ago" : dd+"d")+'</span>';
        }).join(" "),
      next: next ? '<span class="muted">'+esc(next.lot)+'</span>' : '<span class="muted">—</span>',
      act:'<button class="btn btn-g btn-s" data-act="stock-receive" data-arg="'+esc(it.item)+'">Receive</button>'
    };
  });

  const stockCard = '<div class="card mb"><div class="card-h"><div><h3>Stock &amp; expiry</h3>'
    + '<p class="muted" style="font-size:.76rem">Batches, not a single number — issue is first-expiry-first-out</p></div>'
    + '<span class="stamp '+(expired.length?"s-risk":soon.length?"s-warn":"s-ok")+'">'
    + (expired.length ? expired.length+" item"+(expired.length===1?"":"s")+" expired"
       : soon.length ? soon.length+" expiring soon" : "All clear")+'</span></div>'
    + '<div class="card-b">'
    + (expired.length
        ? '<div class="alert-band mb"><span class="bang">!</span><span>'
          + esc(listOut(expired.map(it => it.item.toLowerCase())))
          + ' — expired stock is still on the shelf. Discard it before it reaches a patient.</span>'
          + '</div>'
          + '<button class="btn btn-w btn-full mb" data-act="stock-discard">Discard every expired batch</button>'
        : '')
    + (low.length
        ? '<div class="alert-band warn mb"><span class="bang">↓</span><span>At or below buffer: '
          + esc(listOut(low.map(it => it.item.toLowerCase())))+'.</span></div>' : '')
    + dataTable([{k:"item",h:"Item"},{k:"usable",h:"Usable",r:true},{k:"lots",h:"Batches"},
                 {k:"next",h:"Issue next"},{k:"act",h:"",r:true}],
        stockRows, {title:"item", empty:"This workspace does not track stock."})
    + '</div></div>';

  /* -- packages ---------------------------------------------------------- */
  const pkgRows = (s.patientPackages || []).map(pp => {
    const def = pkgDef(pp.pkg), left = def.sessions - pp.used, d = daysTo(pp.expires);
    const perSession = Math.round(def.price / def.sessions);
    return {
      who:'<b>'+esc(patName(pp.pid))+'</b><br><span class="muted" style="font-size:.72rem">'+esc(def.label)+'</span>',
      used:'<div class="meter" style="min-width:80px"><i style="width:'
           + Math.round(pp.used/def.sessions*100)+'%;background:var(--accent-2)"></i></div>'
           + '<span class="muted" style="font-size:.72rem">'+pp.used+' of '+def.sessions+'</span>',
      worth:'<b>'+inr(left*perSession)+'</b><br><span class="muted" style="font-size:.72rem">unearned</span>',
      exp: d < 0 ? '<span style="color:var(--vermilion);font-weight:700">lapsed</span>'
         : d < 60 ? '<span style="color:var(--marigold);font-weight:700">'+d+' days</span>'
         : '<span class="muted">'+d+' days</span>',
      act: left > 0 && d >= 0
        ? '<button class="btn btn-p btn-s" data-act="pkg-redeem" data-arg="'+pp.id+'">Redeem one</button>'
        : '<span class="muted" style="font-size:.72rem">'+(left ? "Expired" : "Complete")+'</span>'
    };
  });
  const unearned = (s.patientPackages || []).reduce((n,pp) => {
    const def = pkgDef(pp.pkg);
    return n + (def.sessions - pp.used) * Math.round(def.price/def.sessions);
  }, 0);

  const pkgCard = '<div class="card mb"><div class="card-h"><div><h3>Packages &amp; series</h3>'
    + '<p class="muted" style="font-size:.76rem">Money taken for work not yet done</p></div>'
    + '<span class="stamp s-warn">'+inr(unearned)+' unearned</span></div>'
    + '<div class="card-b">'
    + dataTable([{k:"who",h:"Patient"},{k:"used",h:"Progress"},{k:"worth",h:"Liability",r:true},
                 {k:"exp",h:"Expires"},{k:"act",h:"",r:true}],
        pkgRows, {title:"who", empty:"No packages sold yet."})
    + '<div class="eyebrow" style="margin:15px 0 7px">What '+esc(cfg.name)+' sells</div>'
    + dataTable([{k:"name",h:"Package"},{k:"n",h:"Visits",r:true},{k:"price",h:"Price",r:true},
                 {k:"valid",h:"Valid for"},{k:"note",h:"What it covers"}],
        (s.packages||[]).map(d => ({
          name:'<b>'+esc(d.label)+'</b>', n:String(d.sessions), price:inr(d.price),
          valid:d.validMonths+" months",
          note:'<span class="muted">'+esc(d.note)+'</span>'
        })), {title:"name", empty:"No packages configured."})
    + '<div class="callout mt"><b>An unredeemed package is a liability, not revenue.</b> '
      + 'It is also the single easiest thing in a clinic to lose track of, which is why a lapsed one '
      + 'triggers a recall rather than quietly becoming profit.</div>'
    + '</div></div>';

  /* -- families ---------------------------------------------------------- */
  const PERMS = [["may_book","Can book"],["may_consent","Can consent"],["may_view_clinical","Can read notes"]];
  const relRows = (s.relationships || []).map(r => {
    const d = r.validUntil ? daysTo(r.validUntil) : null;
    return {
      who:'<b>'+esc(patName(r.guardian))+'</b><br><span class="muted" style="font-size:.72rem">'
          + esc(r.relation)+' of '+esc(patName(r.dependant))+'</span>',
      perms: PERMS.map(([k,label]) =>
        '<button class="perm'+(r[k]?" on":"")+'" data-act="perm" data-arg="'+r.id+'|'+k+'" '
        + 'aria-pressed="'+!!r[k]+'">'+(r[k]?"✓ ":"")+esc(label)+'</button>').join(" "),

           : '<span class="muted">'+Math.round(d/30)+' months</span>'
    };
  });

  const relCard = '<div class="card mb"><div class="card-h"><div><h3>Families &amp; proxy consent</h3>'
    + '<p class="muted" style="font-size:.76rem">Who may act for whom, and exactly how far that goes</p></div></div>'
    + '<div class="card-b">'
    + dataTable([{k:"who",h:"Guardian"},{k:"perms",h:"Permitted"},{k:"until",h:"Until"}],
        relRows, {title:"who", empty:"No proxy relationships recorded."})
    + '<div class="callout mt"><b>Three switches, not one.</b> A grandparent who brings the child to every '
      + 'appointment may need to book and nothing else. A parent of a teenager in therapy may need to consent '
      + 'and must not read the notes. Collapsing these into a single &ldquo;family member&rdquo; flag is how '
      + 'clinical records leak to the wrong relative.</div>'
    + '</div></div>';

  return sectionHead("Practice", cfg.name+" · stock, packages and families")
    + stockCard + pkgCard + relCard + activityCard();
};

VIEWS.consultant = function(){
  const s = T();
  const visiting = s.practitioners.find(d=>d.visiting) || s.practitioners[0];
  const mine = s.appointments.filter(a=>a.doc===visiting.id);
  const blocks = s.external.filter(x=>x.doc===visiting.id);

  const stops = mine.map(a=>({t:a.start, kind:"appt", a}))
    .concat(blocks.map(b=>({t:b.start, kind:"block", b})))
    .sort((x,y)=>x.t-y.t);

  const rows = s.ledger.map(l=>{
    const net = netOf(l, visiting.split), st = SETTLE_STATUS[l.status] || SETTLE_STATUS.draft;
    return {
      when:'<b>'+esc(l.date)+'</b><br><span class="muted" style="font-size:.72rem">'+esc(l.clinic)+'</span>',
      what:esc(l.desc) + (l.repriced ? '<br><span class="muted" style="font-size:.72rem">Repriced — '+esc(l.repriced.from)+'</span>' : ''),
      gross:inr(l.gross),
      ded:'<span class="muted">−'+inr(l.lab+l.consum)+'</span>',
      net:'<b>'+inr(net)+'</b>',
      status:'<span class="stamp '+st.stamp+' flat" style="font-size:.55rem">'+esc(st.label)+'</span>'
    };
  });
  const disputed = s.ledger.filter(l => l.status === "disputed");
  const owed = s.ledger.filter(l => l.status !== "settled" && l.status !== "disputed")
    .reduce((n,l) => n + netOf(l, visiting.split), 0);

  /* The consultant's half of FR-6.5. A disputed line is not a dead end: it
     arrives with a reason and a number, and one tap closes it. */
  const disputeCard = disputed.length
    ? '<div class="card"><div class="card-h"><div><h3>Needs your answer</h3>'
      + '<p class="muted" style="font-size:.76rem">The practice has queried '+disputed.length
      + ' line'+(disputed.length===1?"":"s")+'</p></div>'
      + '<span class="stamp s-risk">'+disputed.length+'</span></div><div class="card-b">'
      + disputed.map(l => '<div class="dispute-row">'
          + '<div style="min-width:0"><b>'+esc(l.desc)+'</b>'
          + '<div class="muted" style="font-size:.76rem">'+esc(l.dispute.reason)+' — raised by '
          + esc(l.dispute.by || "the practice")+' at '+hhmm(l.dispute.at)+'</div>'
          + '<div style="font-size:.8rem;margin-top:3px">You claimed <b>'+inr(netOf(l, visiting.split))
          + '</b>, they offer <b>'+inr(l.dispute.proposed)+'</b></div></div>'
          + '<button class="btn btn-p btn-s" data-act="settle-accept" data-arg="'+l.id+'">Accept '
          + inr(l.dispute.proposed)+'</button></div>').join("")
      + '<div class="callout warn mt">Holding out is also an answer. Nothing moves until one of you agrees, '
      + 'and the whole exchange is on a record neither of you can quietly edit.</div>'
      + '</div></div>'
    : "";

  const route = '<div class="timeline">' + (stops.length ? stops.map(st => {
      if(st.kind === "block"){
        return '<div class="tl-item blocked"><div class="tl-time">'+hhmm(st.b.start)+' – '+hhmm(plus(st.b.start,st.b.mins))+'</div>'
          + '<div style="font-weight:700">'+esc(st.b.masked)+'</div>'
          + '<div class="muted" style="font-size:.75rem">Synced from '+esc(st.b.source)+'. '
          + 'PractixOS reads free/busy only — it never sees what this is.</div></div>';
      }
      const a = st.a, p = pat(a.pid), live = ["waiting","in_service"].includes(roleOf(a.lane));
      return '<div class="tl-item'+(live?" now":"")+'"><div class="tl-time">'+hhmm(a.start)+' · '+a.mins+' min</div>'
        + '<div style="font-weight:700">'+esc(p.name)+' <span class="token">T'+tokenOf(a)+'</span></div>'
        + '<div class="muted" style="font-size:.78rem">'+esc(a.reason)+' · '+esc(room(a.chair))+'</div>'
        + (p.alerts.length?'<div class="stamp s-risk mt-s">'+esc(p.alerts.join(", "))+'</div>':'')
        + '</div>';
    }).join("") : '<p class="muted">No stops on today’s route.</p>') + '</div>';

  /* On a phone this IS the phone, so no bezel. On a desktop the bezel is
     honest signalling that this screen is designed for a pocket. */
  const card = '<div class="frame"><div class="frame-notch"></div><div class="frame-body">'
    + '<div class="between mb"><div><h3>'+esc(visiting.name)+'</h3>'
      + '<p class="muted" style="font-size:.74rem">'+esc(visiting.qual)+' · '+esc(TENANT().name)+'</p></div>'
      + '<span class="stamp s-info">'+mine.length+' stops</span></div>'
    + route + '</div></div>';

  return sectionHead("Route card", "Today across every clinic on your circuit",
      '<span class="stamp s-warn flat">'+inr(owed)+' awaiting settlement</span>')
  + '<div class="route-grid mb">' + card
    + '<div class="col">'
      + '<div class="card"><div class="card-h"><div><h3>Earnings ledger</h3>'
        + '<p class="muted" style="font-size:.76rem">'+Math.round(visiting.split*100)
        + '% of gross, after lab work and consumables</p></div></div><div class="card-b">'
        + dataTable([{k:"when",h:"When"},{k:"what",h:"Procedure"},{k:"gross",h:"Gross",r:true},
                     {k:"ded",h:"Deductions",r:true},{k:"net",h:"Your share",r:true},{k:"status",h:"Status"}],
                    rows, {title:"what", empty:"No procedures billed yet."})
      + '</div></div>'
      + disputeCard
      + '<div class="callout"><b>The split is arithmetic, not a conversation.</b> '
        + Math.round(visiting.split*100)+'% of gross after lab work and consumables, agreed once and applied every time. '
        + 'This single screen replaces the WhatsApp thread most visiting consultants currently use to chase payment.</div>'
      + '<button class="btn btn-p btn-full" data-act="request-settle"'+(owed?"":" disabled")+'>'
        + (owed ? 'Request settlement of '+inr(owed) : 'Nothing to request')+'</button>'
    + '</div>'
  + '</div>';
};

/* ==========================================================================
   FR-6.5 — TWO-SIDED SETTLEMENT
   The visiting consultant's WhatsApp thread exists because there is no shared
   artifact both parties trust. A one-sided statement does not fix that; it
   just moves whose word it is. So every line has two signatures on it, a
   dispute names a reason rather than going quiet, and both parties read the
   same trail.
   ========================================================================== */
const SETTLE_STATUS = {
  draft:    {label:"Not submitted", stamp:"s-mute"},
  requested:{label:"Awaiting owner", stamp:"s-warn"},
  approved: {label:"Approved",       stamp:"s-info"},
  disputed: {label:"Disputed",       stamp:"s-risk"},
  settled:  {label:"Settled",        stamp:"s-ok"}
};
/* The reasons a practice actually disputes a line. A free-text box produces
   "as discussed", which is how the WhatsApp thread started. */
const DISPUTE_REASONS = [
  ["lab","Lab cost was not deducted"],
  ["consum","Consumables are understated"],
  ["notdone","This procedure was not performed here"],
  ["split","The agreed split is different"],
  ["dupe","This line duplicates another"]
];
function netOf(l, split){ return Math.round((l.gross - l.lab - l.consum) * split); }
const consultantOf = () => T().practitioners.find(d=>d.visiting) || T().practitioners[0];

function settlementCard(){
  const s = T(), cons = consultantOf();
  const open = s.ledger.filter(l => ["requested","approved","disputed"].includes(l.status));
  const approved = s.ledger.filter(l => l.status === "approved");
  const payable = approved.reduce((n,l) => n + netOf(l, cons.split), 0);

  const rows = open.map(l => {
    const st = SETTLE_STATUS[l.status];
    return {
      what:'<b>'+esc(l.desc)+'</b><br><span class="muted" style="font-size:.72rem">'+esc(l.date)+' · '+esc(l.clinic)+'</span>',
      gross:inr(l.gross),
      ded:'<span class="muted">−'+inr(l.lab+l.consum)+'</span>',
      net:'<b>'+inr(netOf(l, cons.split))+'</b>',
      state:'<span class="stamp '+st.stamp+' flat" style="font-size:.55rem">'+esc(st.label)+'</span>'
            + (l.dispute ? '<br><span class="muted" style="font-size:.72rem">'+esc(l.dispute.reason)
               + (l.dispute.proposed!=null ? ' — offers '+inr(l.dispute.proposed) : '')+'</span>' : ''),
      act: l.status === "requested"
        ? '<div class="row" style="gap:5px;justify-content:flex-end">'
          + '<button class="btn btn-p btn-s" data-act="settle-approve" data-arg="'+l.id+'">Approve</button>'
          + '<button class="btn btn-g btn-s" data-act="settle-dispute" data-arg="'+l.id+'">Dispute</button></div>'
        : l.status === "disputed"
        ? '<button class="btn btn-g btn-s" data-act="settle-withdraw" data-arg="'+l.id+'">Withdraw dispute</button>'
        : '<span class="muted" style="font-size:.72rem">Ready to pay</span>'
    };
  });

  return '<div class="card mb"><div class="card-h"><div><h3>Consultant settlement</h3>'
    + '<p class="muted" style="font-size:.76rem">'+esc(cons.name)+' · '+Math.round(cons.split*100)
    + '% of gross after lab work and consumables</p></div>'
    + '<span class="stamp '+(payable?"s-warn":"s-ok")+'">'+inr(payable)+' payable</span></div>'
    + '<div class="card-b">'
    + dataTable([{k:"what",h:"Procedure"},{k:"gross",h:"Gross",r:true},{k:"ded",h:"Deductions",r:true},
                 {k:"net",h:"Their share",r:true},{k:"state",h:"State"},{k:"act",h:"",r:true}],
        rows, {title:"what", empty:"Nothing is awaiting your approval."})
    + (approved.length
        ? '<button class="btn btn-p btn-full mt" data-act="settle-pay">Settle '+approved.length
          + ' line'+(approved.length===1?"":"s")+' · '+inr(payable)+'</button>' : '')
    + '<div class="callout mt"><b>A dispute has to name a reason.</b> '
      + 'Both of you see the same line, the same reason and the same timestamp, which is the entire '
      + 'point — the argument happens against a shared record instead of two different memories.</div>'
    + '</div></div>';
}

VIEWS.owner = function(){
  const s = T(), cfg = TENANT();
  const collected = s.cash.cash + s.cash.upi;
  const roomIds = Object.keys(s.roomUse);
  const totalMins = roomIds.length * s.roomMinutesPerDay;
  const usedMins = roomIds.reduce((n,k)=>n+s.roomUse[k],0);
  const util = Math.round(usedMins/totalMins*100);
  const perDay = Math.round(cfg.overhead/26);

  /* DHIS, Corrigendum 7: only KYC-verified links count, and the first 100 of
     those earn nothing. Both clamps matter — one seeded tenant sits below the
     floor and correctly earns zero. */
  const abdmEligible = Math.max(0, s.abdm.kycVerified - s.abdm.baselineExcluded);
  const abdmEarned   = abdmEligible * s.abdm.ratePerBundle;
  const toFloor      = Math.max(0, s.abdm.baselineExcluded - s.abdm.kycVerified);

  const recovered = s.recovered.reduce((n,r)=>n + r.n*r.unit, 0);
  const price     = cfg.plan.price;
  const multiple  = (recovered/price).toFixed(1);
  /* The number that actually persuades: how few events pay for the month. */
  const topUnit   = s.recovered.length ? s.recovered[0].unit : price;
  const breakEven = Math.ceil(price/topUnit);
  const started   = s.recovered.length > 0;

  const kpis = '<div class="grid g4 mb">'

    + kpi("Outstanding", inr(s.cash.pending), s.cash.pending?"Across "+inRole("settlement").length+" open bills":"Nothing owed", s.cash.pending?"s-warn":"s-ok")

  const recRows = s.recovered.map(r => {

    return {
      what:'<b>'+esc(m.label)+'</b><br><span class="muted" style="font-size:.72rem">'+esc(m.why)+'</span>',
      count:String(r.n),
      unit:inr(r.unit),
      value:'<b>'+inr(r.n*r.unit)+'</b>',
      ev:'<span class="muted" style="font-size:.72rem">'+esc(m.ev)+'</span>'

  const roomRows = roomIds.map(k => {

    const mine = s.appointments.filter(a=>a.doc===d.id);

      who:'<b>'+esc(d.name)+'</b><br><span class="muted" style="font-size:.72rem">'+esc(d.qual)+' · '+esc(d.blurb)+'</span>',

        + (load[i]>=85?"var(--vermilion)":load[i]>=60?"var(--marigold)":"var(--sage)")+'"></i></div></div>').join("")+'</div>'

function qrSVG(vpa){
  let cells = "", seed = 0;
  for(let i=0;i<vpa.length;i++) seed = (seed*31 + vpa.charCodeAt(i)) >>> 0;
  let r = seed || 1;
  for(let y=0;y<21;y++) for(let x=0;x<21;x++){
    const finder = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    r = (r*1103515245 + 12345) & 0x7fffffff;
    const on = finder ? (x===0||x===6||y===0||y===6||(x>1&&x<5&&y>1&&y<5)||
                         (x>13&&(x===14||x===20||y===0||y===6||(x>15&&x<19&&y>1&&y<5)))||
                         (y>13&&(y===14||y===20||x===0||x===6||(y>15&&y<19&&x>1&&x<5))))
                      : (r>>7)%3===0;
    if(on) cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  }
  return '<svg viewBox="-1 -1 23 23" style="width:150px;height:150px;margin:0 auto;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:4px" role="img" aria-label="UPI QR code">'
    + '<g fill="#14211F">'+cells+'</g></svg>';
}

      + 'query can observe it, so the honest answer is that there is nothing there.</div>'

    + '<div class="iso-result">'+esc(
`ALTER TABLE patients ENABLE ROW LEVEL SECURITY;
ALTER TABLE patients FORCE ROW LEVEL SECURITY;

CREATE POLICY tenant_isolation ON patients
  USING      (clinic_id = current_setting('app.clinic_id')::uuid)
  WITH CHECK (clinic_id = current_setting('app.clinic_id')::uuid);

-- set once per request, from the resolved host, before any query runs
SET LOCAL app.clinic_id = '`+cfg.id+`';`)+'</div>'
    + '<div class="callout mt"><b>FORCE matters.</b> Without it the table owner bypasses its own policy, which is exactly the '
      + 'connection your application uses. The application role is also stripped of BYPASSRLS.</div>'
    + '<div class="callout mt"><b>Why a policy and not a WHERE clause.</b> A forgotten WHERE clause in one query out of nine hundred '
      + 'is a breach of the DPDP Act. A policy cannot be forgotten — it applies to every statement, including the ones written '
      + 'three years from now by someone who has never read this file.</div>'
    + '</div></div>';

  const scale = '<div class="card"><div class="card-h"><h3>At '+PROVISIONED.toLocaleString("en-IN")+' tenants</h3></div><div class="card-b">'
    + dataTable([{k:"q",h:"Question"},{k:"a",h:"Answer"}], [
        {q:"One database or a thousand?", a:"One PostgreSQL database, one schema, <b>clinic_id</b> on every row, isolation by policy. A thousand databases means a thousand migrations and a thousand backups."},
        {q:"Where does the tenant come from?", a:"The host. <span class='mono'>aaravdental.practix.in</span> resolves to a clinic row before authentication, and the session is bound to it."},

        {q:"Branding?", a:"Name, mark, accent colour, enabled languages, follow-up window and enabled modules are all tenant columns. This page is already rendering three of them."}
      ], {title:"q"})
    + '</div></div>';

  return sectionHead("Tenant isolation", "Three workspaces are seeded. You are inside exactly one.")
    + sessionCard + dupe + probe + sql + scale;

   below reads the same catalog every other tenant reads; there is no special

function provisionTenant(){
  const o = S.onboard, v = VERTICALS[o.vertical];
  const rows = dryRun(o.csv, o.map).filter(r => r.verdict === "import" || r.verdict === "partial");
  const slug = obSlug() || "new-practice";
  const docId = "own";
  const cfg = {
    id: slug, mark: obMark(),
    name: o.name, legal: o.name,
    host: slug+".practix.in", city: o.city || "India",
    vertical: o.vertical, verticalLabel: v.label+" practice",
    accent:{a:v.accent, b:v.accent, c:v.accent, wash:"#EEF2F2", ink:"#F8FAFA"},
    langs:["en"], followupDays:o.followupDays, overhead:60000,
    vpa: slug.replace(/-/g,"")+"@upi", since:String(new Date().getFullYear()),
    chairsLabel:v.chairWord, plan:{tier:"Solo Practice", price:999},
    staff:{}, provisioned:true,
    seed(){ return {
      practitioners:[{id:docId, name:o.docName, qual:"", kind:"gp", exp:1, fee:500,
                      room:v.chairWord.charAt(0).toUpperCase()+v.chairWord.slice(1)+" 1",
                      langs:["English"], blurb:v.label}],
      stages:v.stages, measures:v.measures,
      chairs:[{id:"c1", label:v.chairWord.charAt(0).toUpperCase()+v.chairWord.slice(1)+" 1", caps:["gp"]}],
      patients: rows.map((r,i) => P("i"+i, r.name, r.age || "—",
                  /^f/i.test(r.sex)?"F":/^m/i.test(r.sex)?"M":"—", "en", r.phone,
                  r.last ? Math.max(0, Math.round((new Date(2026,8,11) - r.last)/86400000)) : null,
                  r.notes && ALERT_TAGS.includes(r.notes) ? [r.notes] : [], null, null)),
      appointments:[], external:[], teeth:{}, plans:{}, labOrders:[], labs:[],
      inventory:[], packages:[], patientPackages:[], relationships:[], ledger:[], vault:null,
      recallRules: v.rules.map((r,i) => RR("rr"+i, r[0], r[1],
                     r[1]==="plan_dormant" ? {days:r[2]*30} : {months:r[2]}, "Set up during onboarding", 0)),
      recalls:[],
      /* A brand-new practice has earned nothing yet, and the screens say so
         rather than inventing an encouraging number. */
      abdm:{bundles:0, kycVerified:0, ratePerBundle:5, baselineExcluded:100,
            monthlyTarget:0, m1Verified:0, m3Consents:0},
      recovered:[],
      cash:{cash:0, upi:0, pending:0},
      roomUse:{c1:0}, roomMinutesPerDay:480,
      audit:[], feed:[], wa:{}
    };}
  };
  MODULES_BY_VERTICAL[cfg.vertical].forEach(m => { if(m !== "patient") cfg.staff[m] = o.docName; });

  const existing = TENANTS.findIndex(t => t.id === cfg.id);
  if(existing >= 0) TENANTS.splice(existing, 1, cfg); else TENANTS.push(cfg);

  S.gate = "signin"; S.gatePick = cfg.id;
  render();

}

/* -- pointer drag. HTML5 drag-and-drop never fires from a finger, so the
      Kanban is built on pointer events and works identically with a mouse,
      a stylus and a thumb. On a phone only one lane is visible, so the grip
      opens the move sheet instead. ----------------------------------------- */
let drag = null, dragEndedAt = 0;
document.addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-drag]");
  if(!g || S.lay === "phone" || e.button) return;
  const card = g.closest(".qcard"); if(!card) return;
  const r = card.getBoundingClientRect();
  drag = {id:g.dataset.drag, card, ox:e.clientX-r.left, oy:e.clientY-r.top, w:r.width,
          x0:e.clientX, y0:e.clientY, ghost:null, pid:e.pointerId};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 7) return;
    const g = drag.card.cloneNode(true);
    g.classList.add("ghost"); g.style.setProperty("--gw", drag.w+"px");
    document.body.appendChild(g);
    drag.ghost = g; drag.card.classList.add("dragging");
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ox) + "px";
  drag.ghost.style.top  = (e.clientY - drag.oy) + "px";
  const over = laneUnder(e.clientX, e.clientY);
  document.querySelectorAll(".lane").forEach(l => l.classList.toggle("drop", l === over));
});
document.addEventListener("pointerup", e => {
  if(!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll(".lane").forEach(l => l.classList.remove("drop"));
  if(!d.ghost){ return; }                     // a tap, not a drag — let the click open the menu
  const over = laneUnder(e.clientX, e.clientY);
  d.ghost.remove(); d.card.classList.remove("dragging");
  dragEndedAt = Date.now();
  if(over && over.dataset.lane){
    const a = T().appointments.find(x=>x.id===d.id);
    if(a && a.lane !== over.dataset.lane) return moveCard(d.id, over.dataset.lane);
  }
  render();
});
function laneUnder(x, y){
  for(const l of document.querySelectorAll(".lane")){
    const r = l.getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return l;
  }
  return null;
}

  audit("inventory.deduct", taken.length+" consumables deducted", taken.join(", ") || "nothing issued");
  render();

/* -- therapy vault: real WebCrypto ---------------------------------------- */
async function deriveKey(pin, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptVault(pin){
  const v = T() && T().vault; if(!v) return;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(pin, salt);
  const buf  = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(v.draft)));
  v.salt = salt; v.iv = iv;
  v.cipher = btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/(.{56})/g,"$1\n");
}
async function unlockVault(pin){
  const v = T().vault;
  try{
    const key = await deriveKey(pin, v.salt);
    const raw = Uint8Array.from(atob(v.cipher.replace(/\n/g,"")), c=>c.charCodeAt(0));
    const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:v.iv}, key, raw);
    v.draft = JSON.parse(new TextDecoder().decode(out));
    v.locked = false; v.attempts = 0;
    audit("vault.unlock","Session notes decrypted", patName(v.pid));
    render(); toast("Notes unsealed","Auto-seals after five minutes of inactivity");
  }catch(err){
    v.attempts++;
    audit("vault.fail","Incorrect PIN — attempt "+v.attempts, patName(v.pid));
    render(); toast("Incorrect PIN","Attempt "+v.attempts+" written to the audit trail","risk");
  }
}
function pinStep(i, el){
  el.value = el.value.replace(/\D/g,"").slice(0,1);
  if(el.value && i < 3){ const n = $("pin"+(i+1)); if(n) n.focus(); }
  const pin = [0,1,2,3].map(k => ($("pin"+k)||{}).value || "").join("");
  if(pin.length === 4) unlockVault(pin);
}

ACT["settle-dispute"] = (id) => {
  const l = T().ledger.find(x=>x.id===id); if(!l) return;
  const cons = consultantOf();
  modal({title:"Dispute this line", body:
    '<p class="reg-patient mb">'+esc(l.desc)+' · '+esc(l.date)+'</p>'
    + '<div class="eyebrow mb">Why</div>'
    + '<div class="col" style="gap:7px">'
    + DISPUTE_REASONS.map(([k,label]) =>
        '<button class="btn btn-g btn-full" style="justify-content:flex-start;text-align:left" '
        + 'data-act="settle-dispute-go" data-arg="'+id+'|'+k+'">'+esc(label)+'</button>').join("")
    + '</div>'
    + '<p class="hint" style="margin-top:11px">'+esc(cons.name)+' sees the reason you pick, not a bare rejection, '
    + 'and can accept the correction from their own route card.</p>'});
};
ACT["settle-dispute-go"] = (arg) => {
  const [id, code] = arg.split("|");
  const s = T(), l = s.ledger.find(x=>x.id===id); if(!l) return;
  const reason = (DISPUTE_REASONS.find(r=>r[0]===code) || [,"Disputed"])[1];
  const was = l.status;
  /* A dispute that only says "no" is what the WhatsApp thread already does.
     A dispute that carries a number is something the other side can accept. */
  const proposed = code === "lab"    ? netOf({gross:l.gross, lab:Math.round(l.gross*0.2), consum:l.consum}, consultantOf().split)
                 : code === "consum" ? netOf({gross:l.gross, lab:l.lab, consum:Math.round(l.consum*1.6)}, consultantOf().split)
                 : code === "notdone" || code === "dupe" ? 0
                 : netOf(l, Math.max(0.4, consultantOf().split - 0.05));
  l.status = "disputed";
  l.dispute = {reason, code, proposed, by:S.session.staff, at:new Date(S.clock)};
  audit("settlement.dispute", "Disputed "+l.desc, reason+" · offers "+inr(proposed)+" · line "+id);
  closeModal(); render();
  toast("Line disputed", esc(consultantOf().name.split(" ")[1] || "The consultant")+" has been told why",
        "warn", ()=>{ l.status = was; l.dispute = null; });
};
ACT["settle-withdraw"] = (id) => {
  const l = T().ledger.find(x=>x.id===id); if(!l) return;
  const had = l.dispute;
  l.status = "requested"; l.dispute = null;
  audit("settlement.withdraw", "Dispute withdrawn on "+l.desc, "line "+id);
  render(); toast("Dispute withdrawn", "The line is back in your queue to approve",
                  null, ()=>{ l.status = "disputed"; l.dispute = had; });
};
/* The consultant's half: accepting the owner's number closes the line without
   anyone having to concede in a message thread. */
ACT["settle-accept"] = (id) => {
  const l = T().ledger.find(x=>x.id===id); if(!l || !l.dispute) return;
  const had = l.dispute, was = l.status, cons = consultantOf();
  const target = had.proposed;
  /* Reprice by adjusting the deduction, so the arithmetic on the line still
     reconciles rather than carrying a mystery override. */
  l.consum = Math.max(0, l.gross - l.lab - Math.round(target / cons.split));
  l.status = "approved"; l.dispute = null; l.repriced = {from:had.reason, at:new Date(S.clock)};
  audit("settlement.accept", "Correction accepted on "+l.desc, had.reason+" · now "+inr(netOf(l, cons.split)));
  render();
  toast("Correction accepted", inr(netOf(l, cons.split))+" agreed on this line",
        null, ()=>{ Object.assign(l, {status:was, dispute:had, repriced:null}); });
};
ACT["settle-pay"] = () => {
  const s = T(), cons = consultantOf();
  const lines = s.ledger.filter(l => l.status === "approved");
  if(!lines.length) return;
  const total = lines.reduce((n,l)=>n+netOf(l, cons.split), 0);
  lines.forEach(l => { l.status = "settled"; l.settledAt = new Date(S.clock); });
  audit("settlement.pay", inr(total)+" settled to "+cons.name, lines.length+" lines · UPI "+TENANT().vpa);
  render();
  toast(inr(total)+" settled", lines.length+" line"+(lines.length===1?"":"s")+" paid to "+cons.name,
        null, ()=>{ lines.forEach(l => { l.status = "approved"; l.settledAt = null; }); });
};

function printModal(){
  const {kind, id, size} = S.print;
  const w = size === "a5" ? 148 : 210, h = size === "a5" ? 210 : 297;
  modal({
    title: SHEETS[kind].title,
    body: '<div class="seg mb">'
        + ['a5','a4'].map(x => '<button class="'+(size===x?"on":"")+'" data-act="print-size" data-arg="'+x+'">'
            + x.toUpperCase()+(x==="a5"?" — half sheet":" — full page")+'</button>').join("")
        + '</div>'
        + '<div class="sheet-wrap"><div class="sheet-scale" style="width:'+w+'mm;height:'+h+'mm">'
        + SHEETS[kind].build(id, size) + '</div></div>'
        + '<p class="hint" style="margin-top:9px">This is the sheet, at its real size, scaled to fit. '
        + 'A5 is the half sheet most clinics already stock; A4 is for anything a patient will carry to a hospital.</p>',
    footer: '<button class="btn btn-p btn-xl btn-full" data-act="print-go">Print</button>'
  });
  /* Scale from the container's measured width rather than a guess, because the
     modal is narrower on a 320 px phone than any constant would assume.
     A transform does not affect layout, so the wrapper's height has to be set
     to what the sheet visually occupies or it leaves a hole beneath it. */
  const wrap = $("modal").querySelector(".sheet-wrap");
  const box  = $("modal").querySelector(".sheet-scale");
  if(!wrap || !box) return;
  const px = mm => mm * 96 / 25.4;
  const avail = wrap.clientWidth - 28;                 // the wrapper's own padding
  const scale = Math.min(1, avail / px(w));
  box.style.transform = "scale(" + scale.toFixed(4) + ")";
  wrap.style.height = Math.round(px(h) * scale) + 28 + "px";
}
